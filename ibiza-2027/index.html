<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ibiza 2027</title></head><body><script>(async()=>{const b64=await fetch('./site.gz.b64').then(r=>r.text());const bytes=Uint8Array.from(atob(b64.trim()),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();})().catch(e=>{document.body.innerHTML='<p style="font-family:system-ui;padding:2rem">The trip page could not load.</p>';console.error(e)});</script></body></html>
