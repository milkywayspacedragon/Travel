name: Rebuild Ibiza map image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify map image
        run: |
          {
            head -c 3000 ibiza-2027/assets/images/map2.part1.b64
            head -c 3000 ibiza-2027/assets/images/map2.part2.b64
            head -c 3000 ibiza-2027/assets/images/map2.part3.b64
            head -c 3000 ibiza-2027/assets/images/map2.part4.b64
            head -c 3000 ibiza-2027/assets/images/map2.part5.b64
            head -c 2720 ibiza-2027/assets/images/map2.part6.b64
          } | base64 -d > ibiza-2027/assets/images/ibiza-pins-map.jpg
          test "$(wc -c < ibiza-2027/assets/images/ibiza-pins-map.jpg)" -eq 13288
      - name: Commit if changed
        run: |
          if git diff --quiet -- ibiza-2027/assets/images/ibiza-pins-map.jpg; then exit 0; fi
          git config user.name "milkywayspacedragon"
          git config user.email "325719968+milkywayspacedragon@users.noreply.github.com"
          git add ibiza-2027/assets/images/ibiza-pins-map.jpg
          git commit -m "Rebuild Ibiza map image"
          git push
