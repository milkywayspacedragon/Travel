name: Add Ibiza trip map image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update map panel
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('ibiza-2027/index.html')
          s = p.read_text()

          css = '.map-preview{margin-top:18px;border-radius:18px;overflow:hidden;border:1px solid rgba(42,40,38,.08);box-shadow:0 8px 24px rgba(52,44,35,.05);background:white}.map-preview img{display:block;width:100%;height:auto}.map-preview figcaption{padding:12px 14px;font-size:.92rem;color:var(--muted)}'
          if '.map-preview{' not in s:
              s = s.replace('</style>', '\n' + css + '\n</style>')

          figure = '<figure class="map-preview"><img src="assets/images/ibiza-pins-map.webp" alt="Map of Ibiza showing Camping La Playa, Hippy Market Punta Arabí, Akasha Ibiza, Pikes Ibiza and 528 Ibiza pinned."/><figcaption>Camping La Playa, Punta Arabí, Akasha, Pikes and 528 across the island.</figcaption></figure>'
          s = re.sub(r'<p class="map-note">.*?</p>', figure, s, count=1, flags=re.S)
          p.write_text(s)
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "milkywayspacedragon"
          git config user.email "325719968+milkywayspacedragon@users.noreply.github.com"
          git add ibiza-2027/index.html
          git commit -m "Add trip map image"
          git push
